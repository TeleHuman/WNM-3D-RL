# Modified by the WNM-3D-RL contributors, 2026.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.2"
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--output-format=full"]
        exclude: ^.*\.(ipynb)$
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.17.0"
    hooks:
      - id: mypy

  - repo: local
    hooks:
      - id: autogen-trainer-cfg
        name: Generate and verify verl_omni/trainer/config/_generated_*.yaml
        entry: scripts/generate_trainer_config.sh
        language: script
        pass_filenames: false

      - id: check-license
        name: Check license
        entry: python3 tools/ci/check_license.py --directories .
        language: python
        pass_filenames: false

      - id: check-naming-conventions
        name: Check naming conventions
        entry: sh -c 'fail=0; if grep -rIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=.specstory --exclude-dir=venv --exclude-dir=.venv --exclude-dir=__pycache__ --exclude=.pre-commit-config.yaml "veRL" .; then echo "Please use verl instead of veRL"; fail=1; fi; if grep -rIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=.specstory --exclude-dir=venv --exclude-dir=.venv --exclude-dir=__pycache__ --exclude=.pre-commit-config.yaml -E "Sglang|sgLang|sglAng|sglaNg|sglanG" .; then echo "Please use SGLang or sglang"; fail=1; fi; exit $fail'
        language: system
        pass_filenames: false

      - id: compileall
        name: Compile all python files
        entry: sh -c 'PYTHONWARNINGS=error python3 -m compileall -q . -x "(^|[\\/])(\.venv|venv|\.git|\.specstory)([\\/]|$)"'
        language: python
        pass_filenames: false
